name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch/PR to save minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint (if defined)
        run: |
          if node -e "process.exit(!!JSON.parse(require('fs').readFileSync('package.json','utf8')).scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "No lint script defined, skipping."
          fi

      - name: Run build
        run: npm run build
